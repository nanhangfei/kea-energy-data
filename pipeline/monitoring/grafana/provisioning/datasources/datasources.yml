# Grafana carries the PIPELINE's health and nothing else — DAG duration,
# failures, freshness, via Airflow's StatsD metrics through the exporter.
#
# There is deliberately no datasource for the serving database. The serving data
# is read in Metabase, which is the single analysis surface: two dashboards over
# the same tables drift, and only one of them ends up being the one anyone
# trusts. See design/kea-data-engineering-stack.md §8.
apiVersion: 1

# Grafana leaves previously-provisioned datasources in place when they are
# removed from this file — the grafana-data volume outlives the config. This
# removes the serving-database datasource that an earlier version provisioned,
# and is a harmless no-op on a fresh volume.
deleteDatasources:
  - name: Kea serving
    orgId: 1

datasources:
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
