version: 2

seeds:
  - name: fixture_weather_daily
    description: >
      The daily temperature each of fixtures 02-09 was written against, one row
      per (fixture ICP, day). GENERATED by pipeline/scripts/ops/gen_fixture_weather.sh
      from sample/*.sql -- regenerate it, never edit it. mart_daily_usage prefers
      it over NIWA, so a fixture's bill is explained against the weather its
      expected answer was computed from (issue #143). DEMO ICPs only: fixture
      01 is a real property and stays on NIWA.
    columns:
      - name: icp_number
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_icp')
                field: icp_number
      - name: date_day
        tests: [not_null]
      - name: temp_mean_c
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_number, date_day]

  - name: climate_region_weather_region
    description: >
      The six climate regions with no NIWA station of their own, each mapped to
      the nearest of the four (dictionary/niwa-weather-source.md).
      distance_km is great-circle, from reference_town to the station, and is
      there so the size of the assumption is visible. A region absent from here
      AND from the stations reaches dim_icp.weather_region unmapped, and
      dim_icp's relationships test fails on it rather than letting its weather
      go NULL.
    columns:
      - name: climate_region
        tests: [not_null, unique]
      - name: weather_region
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_weather__stations')
                field: climate_region
