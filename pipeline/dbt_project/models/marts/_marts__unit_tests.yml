        format: sql
        rows: |
          select
              'Auckland'::varchar                    as climate_region,
              5::number(38,0)                        as month_of_year,
              day_of_month::number(38,0)             as day_of_month,
              3.0::number(38,2)                      as normal_hdd,
              30::number(38,0)                       as sample_years,
              0.5::number(38,2)                      as hdd_stddev
          from (
              select row_number() over (order by seq4()) as day_of_month
              from table(generator(rowcount => 31))
          )
      - input: ref('mart_daily_usage')
        format: sql
        rows: |
          select
              1::number(38,0)                        as icp_id,
              usage_date,
              10::number(38,4)                       as import_kwh,
              0::number(38,4)                        as export_kwh,
              0::number(38,4)                        as controlled_kwh,
              10::number(38,4)                       as uncontrolled_kwh,
              48::number(38,0)                       as interval_count,
              4.8::number(38,4)                      as base_load_kwh,
              48::number(38,0)                       as expected_intervals,
              0::number(38,0)                        as estimated_count,
              15::number(5,2)                        as temp_mean_c,
