        format: sql
        rows: |
          select
              1::number(38,0)                        as icp_id,
              usage_date,
              0.1::number(38,4)                      as floor_kwh_per_hh,
              iff(usage_date >= '2025-05-17'::date, 9.0, 1.0)::number(38,4)
                                                     as ev_kwh_low,
              iff(usage_date >= '2025-05-17'::date, 9.6, 1.2)::number(38,4)
                                                     as ev_kwh_high,
              2::number(38,0)                        as ev_half_hours,
              'high_power'::varchar                  as ev_charger_class,
              'medium'::varchar                      as ev_confidence,
              0.5::number(38,4)                      as timed_night_kwh_low,
              0.7::number(38,4)                      as timed_night_kwh_high,
              1::number(38,0)                        as timed_night_half_hours,
              'high'::varchar                        as timed_night_confidence,
              0::number(38,0)                        as masked_intervals,
              'detect-v2'::varchar                   as method_version
          from (
              select dateadd(day, row_number() over (order by seq4()) - 1, '2025-05-08'::date)
                         as usage_date
              from table(generator(rowcount => 13))
          )
