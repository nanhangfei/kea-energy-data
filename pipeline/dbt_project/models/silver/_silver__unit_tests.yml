  - name: import_runs_withholds_what_the_sun_took
    description: >
      What masking is allowed to change, and what it is not. Three generating
      households, one summer day each, floor 0.1.
        1 a steady 2.5 kW charge across the whole shoulder, 8 half-hours
          -> ev, charger_class NULL, confidence low.
          detect-v1 called this ev / low_power / medium. The class is the
          false claim being removed: a 7 kW wallbox shaved by 4.5 kW of sun
          and a 2.5 kW portable charger are THE SAME SIGNAL here.
        2 a wallbox that clears 5 kW anyway, 4 half-hours across the shoulder
          -> ev, high_power SURVIVES, confidence capped from high to low.
          PV only ever subtracts, so a run above the threshold after the
          subtraction really did draw at least that.
        3 THE CONTROL: the same household shape charging at 21:00, nothing
          masked -> ev, high_power, high, masked_half_hours 0, exactly as
          detect-v1 had it. Panels change nothing in the dark; if this row
          ever moves, the change is not targeted.
      ⚠️ 1 and 2 are masked over their WHOLE length, which is not a
      simplification: a half-hour cannot import and export at once, so the
      day's last exporting half-hour is never inside a run, and a run is
      therefore either wholly inside the shoulder or wholly outside it.
      December is NZDT (+13:00), so 21:00Z on the 10th is local 10:00 on the
      11th.
    model: int_metering__import_runs
    given:
      - input: ref('int_metering__import_half_hours')
        format: sql
        rows: |
          select
              column1::number(38,0)                                        as icp_id,
              column2::timestamp_tz                                        as interval_start,
              floor(date_part(epoch_second, column2::timestamp_tz) / 1800)::number(38,0)
                                                                           as slot_no,
              convert_timezone('Pacific/Auckland', column2::timestamp_tz)::date
                                                                           as usage_date,
              column3::number(12,4)                                        as kwh,
              column4::number(12,4)                                        as export_kwh,
              0.1::number(12,4)                                            as floor_kwh_per_hh,
              (column3 - 0.1)::number(12,4)                                as excess_kwh,
              column5::number(38,0)                                        as expected_intervals,
              true                                                         as is_assessed_day,
              column6                                                      as is_masked,
              column7                                                      as is_daylight_shoulder,
              column8                                                      as is_candidate,
              column9::timestamp_tz                                        as run_start,
              false                                                        as is_tail
          from values
              -- icp, half-hour (UTC), import, export, expected, masked, shoulder, candidate, run
              (1, '2025-12-10 20:00:00 +00:00', 0.00, 0.6, 10, true,  false, false, null),
              (1, '2025-12-10 21:00:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-10 21:30:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-10 22:00:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-10 22:30:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-10 23:00:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-10 23:30:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-11 00:00:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-11 00:30:00 +00:00', 1.25, 0.0, 10, false, true,  true,  '2025-12-10 21:00:00 +00:00'),
              (1, '2025-12-11 02:00:00 +00:00', 0.00, 0.5, 10, true,  false, false, null),
              (2, '2025-12-10 20:00:00 +00:00', 0.00, 0.6,  6, true,  false, false, null),
              (2, '2025-12-10 22:00:00 +00:00', 3.00, 0.0,  6, false, true,  true,  '2025-12-10 22:00:00 +00:00'),
              (2, '2025-12-10 22:30:00 +00:00', 3.00, 0.0,  6, false, true,  true,  '2025-12-10 22:00:00 +00:00'),
              (2, '2025-12-10 23:00:00 +00:00', 3.00, 0.0,  6, false, true,  true,  '2025-12-10 22:00:00 +00:00'),
              (2, '2025-12-10 23:30:00 +00:00', 3.00, 0.0,  6, false, true,  true,  '2025-12-10 22:00:00 +00:00'),
              (2, '2025-12-11 02:00:00 +00:00', 0.00, 0.5,  6, true,  false, false, null),
              (3, '2025-12-10 20:00:00 +00:00', 0.00, 0.6,  6, true,  false, false, null),
              (3, '2025-12-11 02:00:00 +00:00', 0.00, 0.5,  6, true,  false, false, null),
              (3, '2025-12-11 08:00:00 +00:00', 3.00, 0.0,  6, false, false, true,  '2025-12-11 08:00:00 +00:00'),
              (3, '2025-12-11 08:30:00 +00:00', 3.00, 0.0,  6, false, false, true,  '2025-12-11 08:00:00 +00:00'),
              (3, '2025-12-11 09:00:00 +00:00', 3.00, 0.0,  6, false, false, true,  '2025-12-11 08:00:00 +00:00'),
              (3, '2025-12-11 09:30:00 +00:00', 3.00, 0.0,  6, false, false, true,  '2025-12-11 08:00:00 +00:00')
    expect:
      rows:
        - {icp_id: 1, run_start: '2025-12-10 21:00:00 +00:00', half_hours: 8, masked_half_hours: 8, detected_class: ev, charger_class: null,       confidence: low,  method_version: detect-v2}
        - {icp_id: 2, run_start: '2025-12-10 22:00:00 +00:00', half_hours: 4, masked_half_hours: 4, detected_class: ev, charger_class: high_power, confidence: low,  method_version: detect-v2}
        - {icp_id: 3, run_start: '2025-12-11 08:00:00 +00:00', half_hours: 4, masked_half_hours: 0, detected_class: ev, charger_class: high_power, confidence: high, method_version: detect-v2}

  - name: detected_half_hours_bounds
    description: >
      low is the draw above the run's adjacent level, high the draw above the
      floor. A 7.5 kWh session (3.6 + 3.6 + 0.3 in the tail, on a household
