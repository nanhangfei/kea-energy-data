  - name: heating_sensitivity_net_of_detected_loads
    description: >
      Household 1 uses 10 + HDD a day, and from July an EV adds 7 kWh on
      alternate days, which mart_daily_detected_load reports. Fitted net of it,
      the slope stays 1.0 and the baseline 10.0. Without the subtraction July
      would sit 3.5 kWh a day above the line. Incomplete days (26th to 28th,
      100 kWh) and a 10-day November (50 kWh a day) must not enter the fit.
      Household 2 has no detected-load rows and fits 5 + 0.5 HDD as before.
    model: int_metering__heating_sensitivity
    given:
      - input: ref('mart_daily_usage')
        format: sql
        rows: |
          select
              icp_id::number(38,0)                   as icp_id,
              usage_date,
              import_kwh::number(38,4)               as import_kwh,
              0::number(38,4)                        as export_kwh,
              0::number(38,4)                        as controlled_kwh,
              import_kwh::number(38,4)               as uncontrolled_kwh,
              interval_count::number(38,0)           as interval_count,
              4.8::number(38,4)                      as base_load_kwh,
              48::number(38,0)                       as expected_intervals,
              0::number(38,0)                        as estimated_count,
              null::number(5,2)                      as temp_mean_c,
              hdd::number(6,2)                       as heating_degree_days,
              false                                  as is_weekend,
              false                                  as is_public_holiday
          from (
              select
                  i.icp_id,
                  d.usage_date,
                  m.hdd,
                  iff(day(d.usage_date) > 25, 40, 48) as interval_count,
                  case
                      when day(d.usage_date) > 25 then 100
                      when month(d.usage_date) = 11 then 50
                      when i.icp_id = 2 then 5 + 0.5 * m.hdd
                      else 10 + m.hdd
                           + iff(d.usage_date >= '2024-07-01'::date
                                 and mod(day(d.usage_date), 2) = 1, 7, 0)
                  end                                 as import_kwh
              from (select column1 as icp_id from values (1), (2)) i
              cross join (
                  select dateadd(day, row_number() over (order by seq4()) - 1, '2024-03-01'::date)
                             as usage_date
                  from table(generator(rowcount => 275))
              ) d
              join (
                  select column1 as month_no, column2 as hdd
                  from values (3, 2), (4, 4), (5, 6), (6, 8), (7, 10), (8, 8), (9, 6), (10, 4), (11, 5)
              ) m
                on m.month_no = month(d.usage_date)
              where day(d.usage_date) <= iff(i.icp_id = 1, 28, 25)
                and (month(d.usage_date) < 11 or day(d.usage_date) <= 10)
          )
      - input: ref('mart_daily_detected_load')
        format: sql
        rows: |
          select
              1::number(38,0)                        as icp_id,
              usage_date,
              0.1::number(38,4)                      as floor_kwh_per_hh,
              7.0::number(38,4)                      as ev_kwh_low,
              7.6::number(38,4)                      as ev_kwh_high,
              2::number(38,0)                        as ev_half_hours,
              'high_power'::varchar                  as ev_charger_class,
              'medium'::varchar                      as ev_confidence,
              0::number(38,4)                        as timed_night_kwh_low,
              0::number(38,4)                        as timed_night_kwh_high,
              0::number(38,0)                        as timed_night_half_hours,
              null::varchar                          as timed_night_confidence,
              0::number(38,0)                        as masked_intervals,
              'detect-v2'::varchar                   as method_version
          from (
              select dateadd(day, row_number() over (order by seq4()) - 1, '2024-07-01'::date)
                         as usage_date
              from table(generator(rowcount => 123))
          )
          where day(usage_date) <= 25
            and mod(day(usage_date), 2) = 1
    expect:
      rows:
        - {icp_id: 1, fitted_on_months: 8, fitted_on_days: 200, heating_sensitivity_kwh_per_hdd: 1.0, baseline_daily_kwh: 10.0, fit_r2: 1.0}
        - {icp_id: 2, fitted_on_months: 8, fitted_on_days: 200, heating_sensitivity_kwh_per_hdd: 0.5, baseline_daily_kwh: 5.0,  fit_r2: 1.0}

  # §6.3's retry counter, pinned to what it counts: metering load dates, not
  # dbt runs. The metering extract in RAW is 2027-08-28 throughout.
  - name: orphan_streak_counts_load_dates_not_runs
    description: >
      A1 is a new orphan: one miss. A2 was counted against this same extract,
      so rebuilding over it changes nothing. A3 was last counted a day earlier:
      one more. A4 predates the date column, so it keeps its count and takes
      this extract's date -- never an extra miss. A5 was counted against a
      LATER extract than the one now in RAW, as a backfill leaves it: its count
      and its date both hold. A6's ICP is in metering now, so it is not in the
      output at all (the post-hook deletes its old row).
    model: int_integrity__orphan_streak
    overrides:
      macros:
        is_incremental: true
    given:
      - input: ref('stg_billing__accounts')
        rows:
          - {account_number: A1, icp_number: X1}
          - {account_number: A2, icp_number: X2}
          - {account_number: A3, icp_number: X3}
          - {account_number: A4, icp_number: X4}
          - {account_number: A5, icp_number: X5}
          - {account_number: A6, icp_number: K6}
      - input: ref('key_map_icp')
        rows:
          - {icp_number: K6}
      - input: ref('stg_metering__connection_points')
        rows:
          - {icp_identifier: K6, _load_date: '2027-08-28'}
      - input: this
        format: sql
        rows: |
          select
              column1::varchar                     as subject_key,
              'account'::varchar                   as subject_type,
              column2::varchar                     as subject_id,
              column3::varchar                     as missing_reference,
              column4::number(9,0)                 as consecutive_misses,
              current_timestamp()                  as last_missed_at,
              column5::date                        as last_missed_load_date
          from values
              ('account:A2', 'A2', 'X2', 2, '2027-08-28'),
              ('account:A3', 'A3', 'X3', 2, '2027-08-27'),
              ('account:A4', 'A4', 'X4', 2, null),
              ('account:A5', 'A5', 'X5', 1, '2027-08-29'),
              ('account:A6', 'A6', 'X6', 1, '2027-08-27')
    expect:
      rows:
        - {subject_key: 'account:A1', consecutive_misses: 1, last_missed_load_date: '2027-08-28'}
        - {subject_key: 'account:A2', consecutive_misses: 2, last_missed_load_date: '2027-08-28'}
        - {subject_key: 'account:A3', consecutive_misses: 3, last_missed_load_date: '2027-08-28'}
        - {subject_key: 'account:A4', consecutive_misses: 2, last_missed_load_date: '2027-08-28'}
        - {subject_key: 'account:A5', consecutive_misses: 1, last_missed_load_date: '2027-08-29'}

  - name: orphan_streak_first_build
    description: >
      No table yet: every orphan starts at one miss, dated by the metering
      extract it was judged against.
    model: int_integrity__orphan_streak
    overrides:
      macros:
        is_incremental: false
    given:
      - input: ref('stg_billing__accounts')
        rows:
          - {account_number: A1, icp_number: X1}
          - {account_number: A6, icp_number: K6}
      - input: ref('key_map_icp')
        rows:
          - {icp_number: K6}
      - input: ref('stg_metering__connection_points')
        rows:
          - {icp_identifier: K6, _load_date: '2027-08-28'}
    expect:
      rows:
        - {subject_key: 'account:A1', consecutive_misses: 1, last_missed_load_date: '2027-08-28'}
