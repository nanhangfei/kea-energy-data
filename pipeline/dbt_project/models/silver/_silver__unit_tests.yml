    model: int_metering__detected_half_hours
    given:
      - input: ref('int_metering__import_half_hours')
        rows:
          - {icp_id: 1, interval_start: '2025-06-10 06:00:00 +00:00', usage_date: '2025-06-10', is_assessed_day: true, is_tail: false, kwh: 0.4, floor_kwh_per_hh: 0.1, run_start: null}
          - {icp_id: 1, interval_start: '2025-06-10 06:30:00 +00:00', usage_date: '2025-06-10', is_assessed_day: true, is_tail: false, kwh: 3.9, floor_kwh_per_hh: 0.1, run_start: '2025-06-10 06:30:00 +00:00'}
          - {icp_id: 1, interval_start: '2025-06-10 07:00:00 +00:00', usage_date: '2025-06-10', is_assessed_day: true, is_tail: false, kwh: 3.9, floor_kwh_per_hh: 0.1, run_start: '2025-06-10 06:30:00 +00:00'}
