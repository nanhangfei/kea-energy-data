version: 2

# Silver's tests are where structural checking stops and CORRECTNESS checking
# starts. Staging could only assert that parse agreed with its own contract;
# these assert the two rules design §6.2 says are easy to break, and the dedup
# rule §4.1 states. Each one fails loudly on exactly the mistake it names.

models:
  - name: key_map_icp
    description: >
      Append-only ICP surrogates. Seeded from METERING ONLY -- an ICP that
      exists in billing and not here is design §6.3's orphan reference, a
      quarantine case rather than a new key.
    columns:
      - name: icp_number
        description: The business key. Never renumbered once seen.
        tests: [not_null, unique]
      - name: icp_id
        description: bigint surrogate; kea_serving_schema.sql:110 is the consumer.
        tests: [not_null, unique]

  - name: key_map_customer
    description: Append-only customer surrogates, same mechanism as key_map_icp.
    columns:
      - name: customer_number
        tests: [not_null, unique]
      - name: customer_id
        tests: [not_null, unique]

  - name: key_map_plan
    description: >
      Append-only PLAN VERSION surrogates. 73 versions across 41 codes in the
      current catalogue, which is why the key is the version and not the code.
    columns:
      - name: plan_id
        tests: [not_null, unique]
      - name: plan_code
        tests: [not_null]
      - name: effective_from
        description: The source's valid_from. This is the only place the two names meet.
        tests: [not_null]
    tests:
      # THE TEST THAT ENFORCES DESIGN §6.2 RULE 2. `unique` on plan_code alone
      # would pass on a map that had collapsed 73 versions to 41 and made
      # temporal resolution impossible; this fails only on a genuine duplicate
      # version, which is the actual defect.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [plan_code, effective_from]

  - name: int_metering__reads_deduped
    description: >
      One row per (icp, register, interval_start): the highest version_no wins
      (design §4.1). Superseded rows are not selected, not deleted -- the lake
      still holds every version, which is what makes "a correction arrived three
      weeks late" answerable.
    columns:
      - name: read_id
        tests: [not_null, unique]
      - name: version_count
        description: Versions seen for this reading. 1 means nothing superseded it.
        tests: [not_null]
    tests:
      # THE POINT OF THE MODEL, ASSERTED. Staging deliberately allows duplicates
      # on this triple because a revision is a new row; after dedup exactly one
      # must survive. A failure here means either the dedup is wrong or the
      # extract double-counted a row across two load dates -- which is what
      # Stage 3's gate exists to prevent, so it should fail here loudly rather
      # than be smoothed over.
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_identifier, register_code, interval_start]

  - name: int_billing__plan_resolution
    description: >
      Each invoice resolved to the plan version in force at its PERIOD END
      (design §2.1.2). Unmatched invoices carry a null plan_id and are
      quarantined rather than falling back to the nearest version.
    columns:
      - name: invoice_id
        tests: [not_null, unique]
      - name: versions_matched
        description: >
          0 = nothing covered the period (quarantined). >1 = the catalogue has
          overlapping versions for the code, a source defect worth seeing even
          though this model picks the latest that covers the date.
        tests: [not_null]

  - name: int_billing__payments_deduped
    description: >
      One latest extracted representation per payment_id. The source is
      append-only today; this prevents a future re-delivery from duplicating a
      payment in serving.
    columns:
      - name: payment_id
        tests: [not_null, unique]
      - name: account_id
        tests: [not_null]
      - name: paid_at
        tests: [not_null]

  - name: int_billing__account_plan_history_resolution
    description: >
      Account plan history resolved to the plan version that brackets the
      history row's valid_from. No nearest-version fallback is allowed.
    columns:
      - name: history_id
        tests: [not_null, unique]
      - name: versions_matched
        tests: [not_null]

  - name: int_catalogue__term_credits_current
    description: >
      The open source offer per commitment term. Multiple open versions are a
      source defect and fail the uniqueness test instead of being ranked.
    columns:
      - name: term_months
        tests: [not_null, unique]
      - name: monthly_credit
        tests: [not_null]

  - name: int_integrity__orphan_streak
    description: >
      How many consecutive metering extracts a billing reference has been
      missing from. Exists only because design §6.3's orphan and timing-skew
      classes are indistinguishable in a single run. Counts load dates, not
      runs, so rebuilding over the same RAW changes no count.
    columns:
      - name: subject_key
        tests: [not_null, unique]
      - name: consecutive_misses
        tests: [not_null]
      - name: last_missed_load_date
        description: >
          The metering extract (connection_points' _load_date) the latest
          counted miss was judged against. A miss counts only when a build sees
          a later one.

  - name: int_integrity__rejects
    description: >
      The integrity third of the ONE quarantine table (design §6.3). Rows are
      routed, never dropped -- what changes is that the agent must hedge or
      decline for these subjects rather than answer confidently.
    columns:
      - name: subject_id
        tests: [not_null]
      - name: reject_reason
        description: >
          Declared in pipeline/contracts/reject_reasons.json and nowhere else.
          If this test fails, a model invented a code the vocabulary does not
          have -- which is exactly how three rejection paths drift into three
          vocabularies.
        tests:
          - not_null
          - accepted_values:
              arguments:
                values:
                  - integrity.orphan_icp
                  - integrity.timing_skew
                  - integrity.unknown_plan_code
                  - integrity.no_plan_version
                  - integrity.ambiguous_register

  # SPRINT 4 LOAD DETECTION (design §15). Three steps, each its own model so a
  # detection can be debugged from the half-hour up: which half-hours stood
  # out, which runs they formed and what each run was taken to be, and the
  # bounds of the half-hours that are published.
  - name: int_metering__import_half_hours
    description: >
      icp × half-hour of uncontrolled import, with the excess over its own
      date's floor (mart_daily_usage.base_load_kwh / 48) and the run it
      belongs to. Days with no base load are left out: without a floor there
      is no excess.
    columns:
      - name: slot_no
        description: Half-hours since the epoch. Consecutive means +1, across midnight and DST.
        tests: [not_null]
      - name: excess_kwh
        tests: [not_null]
      - name: is_assessed_day
        description: >
          Every half-hour of the NZ day was read on the uncontrolled import
          register. ⚠️ Deliberately unchanged by masking: a solar household's
          night is as readable as anyone else's.
        tests: [not_null]
      - name: export_kwh
        description: >
          The export register for the same half-hour, 0 where there is none.
          Measured, never modelled -- generation itself is not metered.
        tests: [not_null]
      - name: is_masked
        description: >
          The household exported this half-hour, so the import register read 0
          and carries no information about load at all.
        tests: [not_null]
      - name: is_daylight_shoulder
        description: >
          Not exporting, but between the day's first and last export, so load
          is understated by an unknown amount. ⚠️ not_null is load-bearing:
          both window bounds are null on a day that never exported, and
          `true and null` is null in SQL -- which is what the model's coalesce
          is there for.
        tests: [not_null]
      - name: is_tail
        description: >
          The half-hour straight after a run, below the candidate threshold but
          above the tail threshold. Kept in the run's kWh, left out of its
          statistics.
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_id, interval_start]
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_id, slot_no]

  - name: int_metering__import_runs
    description: >
      One run of high import: its shape, its start slot's history and what it
      is taken to be. Only ev and timed_night are published; seasonal_night
      and other stay here for debugging.
    columns:
      - name: detected_class
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: [ev, timed_night, seasonal_night, other]
      - name: core_half_hours
        description: >
          Candidate half-hours. Every run has at least detect_min_run_half_hours;
          a single one is a spike and never forms a run.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: "{{ var('detect_min_run_half_hours') }}"
      - name: half_hours
        tests: [not_null]
      - name: masked_half_hours
        description: >
          Half-hours of this run the import register did not see in full:
          exporting, or between the day's first and last export. Always 0 on
          a household with no export register.
        tests:
          - not_null
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0
      - name: charger_class
        description: >
          Set for an ev run the panels did not hide. Null on an ev run with
          masked half-hours unless it cleared the high-power threshold anyway:
          a shaved wallbox and a portable charger read the same there.
        tests:
          - accepted_values:
              arguments:
                values: [high_power, low_power]
      - name: confidence
        description: Set exactly for published runs; never above low when masked.
        tests:
          - accepted_values:
              arguments:
                values: [low, medium, high]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_id, run_start]
      - dbt_utils.expression_is_true:
          arguments:
            # An EV run carries a charger_class unless the sun was in the way.
            # ⚠️ NOT an equivalence: masked_half_hours is counted for EVERY
            # run on a generating ICP, not just the EV ones, so pairing it
            # with detected_class = 'ev' fails on every daytime hot-water run
            # a solar household has. The converse half -- that only an EV run
            # ever carries a class -- is the separate test below.
            expression: >
              detected_class <> 'ev'
              or masked_half_hours > 0
              or charger_class is not null
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              charger_class is null or detected_class = 'ev'
      - dbt_utils.expression_is_true:
          arguments:
            expression: >
              masked_half_hours = 0
              or charger_class is null or charger_class = 'high_power'
      - dbt_utils.expression_is_true:
          arguments:
            expression: "masked_half_hours = 0 or confidence is null or confidence = 'low'"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "masked_half_hours <= half_hours"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "(detected_class in ('ev', 'timed_night')) = (confidence is not null)"
      - dbt_utils.expression_is_true:
          arguments:
            expression: "half_hours between core_half_hours and core_half_hours + 1"

  - name: int_metering__detected_half_hours
    description: >
      The half-hours of published runs, with their low and high bounds. Both
      detection marts sum these, so the bounds are defined once.
    columns:
      - name: kwh_low
        tests: [not_null]
      - name: kwh_high
        tests: [not_null]
    tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [icp_id, interval_start]
      - dbt_utils.expression_is_true:
          arguments:
            expression: "kwh_low >= 0 and kwh_low <= kwh_high"
