name: "kea"
version: "1.0.0"
config-version: 2

profile: "kea"

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]

clean-targets:
  - "target"
  - "dbt_packages"

vars:
  # Design §6.3: timing skew is retried, "only quarantine after N consecutive
  # failures (default 3)". A var rather than a literal because the right number
  # depends on extract cadence -- three misses is three days on the daily DAGs
  # and three months on the weather one.
  integrity_max_misses: 3

  # Design §8.4 fixes this: GREATEST(16.0 - temp_c, 0), base 16, one definition
  # throughout. A var rather than a literal because it is quoted in four design
  # sections and services/api once carried an 18 with an unsourced docstring --
  # one place to change beats four places to disagree.
  hdd_base_c: 16.0

  # The floor below which a fitted heating slope is not published as usable.
  # A threshold rather than a hidden judgement: on the current cohort almost
  # nothing clears it, and that is the correct answer -- the households are LCL
  # (real LONDON metering, date-shifted) while the weather is real NZ, so there
  # is no mechanism by which the two correlate. See
  # dictionary/lcl-source-data.md. The fixtures' 0.93 is a hand-set constant in
  # generate_scenarios.py, not a fitted property of the cohort.
  min_heating_fit_r2: 0.30

  # ---- Sprint 4: loads only half-hourly data shows (design §15) ----------
  # A change to any of these is a new detect_method_version, which every
  # detected row carries.
  # v2 (20 Sep 2026): PV masking is marked rather than silently misread.
  # No threshold below moved -- what changed is what a run touching a masked
  # half-hour may CLAIM (int_metering__import_runs).
  detect_method_version: "detect-v2"
  # A half-hour is a candidate when its import is at least this far above the
  # day's floor: 0.75 kWh is 1.5 kW held for the half-hour. Kettles and
  # toasters do not hold it; ovens, heaters, hot-water elements and chargers do.
  detect_min_excess_kwh: 0.75
  # The half-hour after a run joins it when it is at least this far above the
  # floor. A load that stops mid-half-hour draws part of one: a charger
  # tapering, a cylinder reaching temperature.
  detect_tail_min_excess_kwh: 0.25
  # A run needs this many candidate half-hours; one alone is a spike.
  detect_min_run_half_hours: 2
  # ev, high_power: at least two half-hours at 2.5 kWh (5 kW) above the floor,
  # at any time of day. No household appliance but a charger or a big heater
  # holds that for an hour, and heaters are taken out first (seasonal rule).
  detect_high_power_excess_kwh: 2.5
  detect_high_power_min_half_hours: 2
  # A start slot matches a pattern within this many half-hours either side.
  detect_slot_tolerance: 1
  # timed_night: starts between these local times. Slots count half-hours
  # from 12:00, so 18 is 21:00 and 37 is 06:30.
  detect_night_first_slot: 18
  detect_night_last_slot: 37
  # timed_night: the mean draw above the floor (1.5 to 4 kW), and the share
  # of assessed nights since the first run that start in the same slot.
  detect_timed_min_excess_kwh: 0.75
  detect_timed_max_excess_kwh: 2.0
  detect_timed_min_night_share: 0.6
  detect_timed_high_confidence_share: 0.8
  # ev, low_power: a steady 1.8 to 4 kW for at least three hours, which is a
  # portable charger. Medium confidence at most: a heater can look the same.
  detect_low_power_min_half_hours: 6
  detect_low_power_min_excess_kwh: 0.9
  detect_low_power_max_excess_kwh: 2.0
  detect_low_power_max_excess_sd: 0.35
  detect_low_power_medium_half_hours: 8
  # Seasonal night block (not published): NZ winter and summer months. A
  # warm month counts as observed with this many assessed days, and the block
  # counts as not running in them below this share of their nights.
  detect_cold_months: [6, 7, 8]
  detect_warm_months: [12, 1, 2]
  detect_min_days_in_month: 20
  detect_seasonal_min_cold_share: 0.5
  detect_seasonal_max_warm_share: 0.1
  # hdd-linear-v3's input: the detected kWh a day over the 28 days up to a
  # snapshot, which needs at least this many assessed days in them.
  detected_load_window_days: 28
  detected_load_min_days: 7

models:
  kea:
    staging:
      # Design §6.1: staging is 1:1 with the source -- rename, cast, nothing
      # else -- so a view costs nothing to keep current and never holds a stale
      # copy of a table the loader just replaced.
      +materialized: view
      +schema: staging

    silver:
      # Design §6.1 allows ephemeral or table. Table, because these are the
      # models a human debugs when a bill will not reconcile, and an ephemeral
      # model has nothing to select from when that happens.
      +materialized: table
      +schema: silver

    marts:
      # Design §6.1: purpose-built for one consumer, denormalised. Table, and
      # each one maps 1:1 onto a kea.mart_* in the serving schema so Stage 5
      # exports without reshaping.
      +materialized: table
      +schema: marts

    gold:
      # Design §6.1 says incremental table for the conformed star. Table for
      # now: incremental buys nothing while a full build is seconds, and an
      # incremental fact with an unproven unique key is a silent duplication
      # risk. Revisit when the backfill makes a full rebuild expensive.
      +materialized: table
      +schema: gold

seeds:
  kea:
    # Reference data the models join and nothing serves, so beside silver.
    # Typed explicitly: left to inference, temp_mean_c would land as a float.
    +schema: silver
    fixture_weather_daily:
      +column_types:
        icp_number: varchar
        date_day: date
        temp_mean_c: number(5,2)
    climate_region_weather_region:
      +column_types:
        climate_region: varchar
        weather_region: varchar
        reference_town: varchar
        distance_km: number(5,0)

# DBT_SCHEMA IS A BASE NAME, NOT A LAYER. dbt's default generate_schema_name
# APPENDS a custom schema to the target, so `kea` + `staging` -> kea_staging and
# `kea` + `silver` -> kea_silver. An earlier version set DBT_SCHEMA=kea_staging
# with no +schema, which put staging in the right place by accident and had
# nowhere to put silver; the note here said a macro would be needed. It is not
# -- the default behaviour is exactly right once the target is a base.
